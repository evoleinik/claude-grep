name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload authenticates with GitHub OIDC, no secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Runs every test once, writes coverage.out, and fails under the 80% floor.
      - name: Test with coverage
        run: scripts/coverage.sh 80

      # fail_ci_if_error stays true. With false, every upload from 2026-03 to
      # 2026-10 was rejected ("Token required") while this job stayed green,
      # so the README badge and the Codecov page showed no number at all.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.out
          disable_search: true
          fail_ci_if_error: true
